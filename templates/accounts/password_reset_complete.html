{% extends "base.html" %}
{% block title %}Şifre Güncellendi - Çiçek Deposu{% endblock %}
{% block content %}
  <div class="auth-page">
    <span class="page-kicker" style="display: block; text-align: center;">Aspiz Flowers</span>
    <h1 class="page-title" style="text-align: center;">Şifreniz Güncellendi</h1>
    <div class="page-rule" style="margin-inline: auto;"></div>

    <div class="account-card" style="text-align: center;">
      <p style="font-size: .85rem; color: var(--text-muted); margin-bottom: 1.5rem;">
        Yeni şifrenizle giriş yapabilirsiniz.
      </p>
      <a href="{% url 'accounts:login' %}" class="login-btn" style="display: inline-flex; width: auto; padding: 0.9rem 2rem;">
        <span class="btn-label">Giriş Yap</span>
        <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>
  </div>
{% endblock %}
